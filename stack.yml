version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db_villacis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - v_villacis:/var/lib/postgresql/data
    networks:
      - n_villacis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: tarea3-flask-web:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      POSTGRES_DB: db_villacis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      DB_PORT: "5432"
    networks:
      - n_villacis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  v_villacis:
    name: v_villacis

networks:
  n_villacis:
    name: n_villacis